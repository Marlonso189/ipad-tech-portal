# Machine-wide config for the desktop app.
# An administrator copies this to %ProgramData%\ipad-tech-portal\config.yaml.
# Technicians do not have permission to edit that file.
# Do not put passwords, API tokens, or other secrets in this file.
#
# The desktop process ignores server.host, server.port, and server.cookie_secure.
# Each session binds 127.0.0.1 on a free port and uses a random launch token.
# The window is HTTP on loopback, so the process forces the session cookie
# not to use the Secure flag. logging.path is also ignored: the application
# log is written under %LOCALAPPDATA%\ipad-tech-portal\logs\.

jamf:
  url: "https://jamf.example.org:8443"
  verify_tls: true
  timeout_seconds: 30

server:
  host: "127.0.0.1"
  port: 8741
  cookie_secure: false
  cookie_name: "itp_session"

session:
  idle_timeout_minutes: 15

groups:
  allowlist: []
  name_prefix: "Tech-"

audit:
  # Absolute path the technicians can create files in. A UNC share is the
  # usual choice on an RDS host. Writes are locked so several sessions can
  # append to one file. {host} and {user} expand to the computer name and
  # the Windows account if you want one file per person instead.
  # If this path cannot be opened within a few seconds, the session writes
  # to %LOCALAPPDATA%\ipad-tech-portal\logs\audit.jsonl and the page says so.
  path: "\\\\files.example.org\\ipad-tech\\audit.jsonl"
  retention_days: 90
  max_bytes: 10485760

inventory:
  update_inventory_after_change: true

logging:
  path: "logs/app.log"
  level: "INFO"
