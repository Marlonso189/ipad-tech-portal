# SPDX-License-Identifier: AGPL-3.0-or-later
# Builds the portal image and pushes it to GHCR.
# This file runs on GitHub (github.com/Marlonso189/ipad-tech-portal), not on Cursor Origin.
# The GitHub repository should be private so the package is created private.

name: Publish container image

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/marlonso189/ipad-tech-portal

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Choose tags
        id: tags
        run: |
          set -eu
          image="${IMAGE}"
          tags="${image}:${GITHUB_SHA}"
          if [ "${GITHUB_REF}" = "refs/heads/main" ]; then
            tags="${tags},${image}:latest"
          fi
          if [[ "${GITHUB_REF}" =~ ^refs/tags/v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            tags="${tags},${image}:${BASH_REMATCH[1]}"
          fi
          echo "tags=${tags}" >> "${GITHUB_OUTPUT}"

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/Marlonso189/ipad-tech-portal
            org.opencontainers.image.licenses=AGPL-3.0-or-later
          cache-from: type=gha
          cache-to: type=gha,mode=max
