# Container config. Copy to config.yaml beside docker-compose.yml and edit it.
# Compose mounts that file read-only at /app/config.yaml.
# Do not put passwords, API tokens, or other secrets in this file.
#
# Technicians type the Jamf Pro server URL on the sign-in page. It is not
# saved here. The published image does not use this file: set
# ITP_INSECURE_TEST_MODE on that container instead, and only for a lab.

# Lab only. Leave false. There is no switch for this on the page.
insecure_test_mode: false

jamf:
  # Verify the Jamf TLS certificate. Set false only for a lab server
  # with a private certificate you cannot trust.
  verify_tls: true
  timeout_seconds: 30

server:
  # Listen on every interface inside the container so the reverse proxy can connect.
  # Do not publish this port on the host when Caddy publishes 443.
  host: "0.0.0.0"
  port: 8741
  cookie_secure: true
  cookie_name: "itp_session"

session:
  idle_timeout_minutes: 15

groups:
  allowlist: []
  name_prefix: "Tech-"

audit:
  path: "/app/logs/audit.jsonl"
  retention_days: 90
  max_bytes: 10485760

inventory:
  update_inventory_after_change: true

logging:
  path: "/app/logs/app.log"
  level: "INFO"
